:root{--ink:#050304;--red:#ff2a1f;--fire:#ff5a00;--bone:#f4efe8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:"Barlow Condensed",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#poster{display:block;touch-action:none;cursor:pointer;background:var(--ink)}
.dock{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:68px}
.hint{font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,239,232,.6);opacity:0;transition:opacity 1s ease}
.hint.on{opacity:1}
.bar{display:flex;gap:8px;opacity:0;transform:translateY(6px);transition:opacity .8s ease,transform .8s ease;pointer-events:none}
.bar.on{opacity:1;transform:none;pointer-events:auto}
.bar button{appearance:none;margin:0;font:400 15px/1 "Anton",Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--bone);background:transparent;border:2px solid rgba(244,239,232,.5);padding:11px 16px 10px;border-radius:0;cursor:pointer;transform:skewX(-8deg);transition:background .15s,border-color .15s,color .15s}
.bar button:hover{border-color:var(--bone)}
.bar button.primary{background:var(--red);border-color:var(--red);color:#fff}
.bar button.primary:hover{background:#ff4a36;border-color:#ff4a36}
.bar button[hidden]{display:none}
.bar button:disabled{opacity:.55;cursor:progress}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-8px);font:700 13px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);padding:10px 16px;opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<script>
(() => {
'use strict';

/* ---------- base ---------- */
const W = 1080, H = 1920, TAU = Math.PI * 2, M = 64, CW = W - M * 2;
const FA = '"Anton", Impact, sans-serif';
const FG = '"Grenze Gotisch", "Old English Text MT", serif';
const FB = '"Barlow Condensed", "Arial Narrow", sans-serif';
const RED = '#ff2a1f', FIRE = '#ff5a00', BONE = '#f4efe8';
const FILE = 'halloween-terceirao.png';
const SHARE_TEXT = 'CONVOCAÇÃO OFICIAL 🎃 Halloween do Terceirão · quinta, 29/10, às 14h, no Anfiteatro. Ingresso: 1 comida ou bebida. Vem fantasiado!';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;
const INTRO = 4.7;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

const layer = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const mat = (tx, ty, sx, sy) => new DOMMatrix([sx, 0, 0, sy, tx, ty]);

function spaced(x, str, px, py, track, align = 'left') {

  const ch = [...str], ws = ch.map(c => x.measureText(c).width);
  const total = ws.reduce((a, b) => a + b, 0) + track * (ch.length - 1);
  let cx = align === 'center' ? px - total / 2 : align === 'right' ? px - total : px;
  ch.forEach((c, i) => { x.fillText(c, cx, py); cx += ws[i] + track; });

}
let MEAS;
const measure = (font, s) => { MEAS.font = font; return MEAS.measureText(s); };

/* ---------- ruído (fumaça e fogo) ---------- */
function noiseField(size, cells, octaves, seed) {
  const out = new Float32Array(size * size), r = rng(seed);
  let amp = 1, norm = 0;
  for (let o = 0; o < octaves; o++) {

  g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(.38, 'rgba(0,0,0,1)'); g.addColorStop(.62, 'rgba(0,0,0,.9)'); g.addColorStop(.75, 'rgba(0,0,0,.25)'); g.addColorStop(1, 'rgba(0,0,0,.15)');

  wx.setTransform(1, 0, 0, 1, 0, 0); wx.globalCompositeOperation = 'source-over'; wx.clearRect(0, 0, w.width, w.height);
  wx.setTransform(k, 0, 0, k, 0, 0);
  const per = 256 * 3.4;
  kit.warmPat.setTransform(mat((((t * -20) % per) + per) % per - per, (((-t * 30) % per) + per) % per - per, 3.4, 3.4));
  wx.fillStyle = kit.warmPat; wx.fillRect(0, 0, W, H);
  wx.globalCompositeOperation = 'destination-in';
  g = wx.createRadialGradient(540, 820, 60, 540, 820, 720);
  g.addColorStop(0, `rgba(0,0,0,${clamp(S.fire, 0, 1.3) * .9})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  wx.fillStyle = g; wx.fillRect(0, 0, W, H);
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalCompositeOperation = 'lighter'; sx.drawImage(w, 0, 0);
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.imageSmoothingEnabled = true;
  x.drawImage(s, SHK.x * kit.sc, SHK.y * kit.sc, x.canvas.width, x.canvas.height); x.restore();
}

function drawGlints(x, sc, S) {
  x.save(); pt(x, sc); x.globalCompositeOperation = 'lighter';
  S.glints.forEach(([gx, gy, k]) => {
    if (k <= 0) return;
    const R = 26 * k;
    x.save(); x.translate(gx, gy); x.rotate(.3);
    x.shadowColor = '#fff'; x.shadowBlur = 16 * sc; x.fillStyle = `rgba(255,255,255,${.95 * Math.min(1, k)})`;
    x.beginPath(); x.moveTo(0, -R); x.quadraticCurveTo(0, 0, R * .3, 0); x.quadraticCurveTo(0, 0, 0, R); x.quadraticCurveTo(0, 0, -R * .3, 0); x.quadraticCurveTo(0, 0, 0, -R); x.fill();
    x.beginPath(); x.moveTo(-R * .6, 0); x.quadraticCurveTo(0, 0, 0, R * .12); x.quadraticCurveTo(0, 0, R * .6, 0); x.quadraticCurveTo(0, 0, 0, -R * .12); x.quadraticCurveTo(0, 0, -R * .6, 0); x.fill();
    x.restore();
  });

}

function drawEmbers(x, sc, embers) {
  x.save(); pt(x, sc); x.globalCompositeOperation = 'lighter'; x.lineCap = 'round';
  embers.forEach(p => {
    const t = p.age / p.life; if (t >= 1) return;
    const a = (t < .1 ? t / .1 : 1 - t) * p.b;
    const col = t < .3 ? [255, 236, 170] : t < .65 ? [255, 140, 40] : [230, 50, 20];
    x.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${a})`; x.lineWidth = p.s;
    x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x - p.vx * .05, p.y - p.vy * .05); x.stroke();
    x.fillStyle = `rgba(255,110,30,${a * .14})`; x.beginPath(); x.arc(p.x, p.y, p.s * 4, 0, TAU); x.fill();
  });
  x.restore();
}

function render(x, kit, S) {
  const sc = kit.sc, cw = x.canvas.width, ch = x.canvas.height;
  CUR_SC = sc; SHK.x = S.shake.x; SHK.y = S.shake.y;
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  let g = x.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, '#0d0609'); g.addColorStop(.5, '#070304'); g.addColorStop(1, '#040203');
  x.fillStyle = g; x.fillRect(0, 0, cw, ch);

  // raios no céu, atrás da abóbora
  x.save(); pt(x, sc); S.strikes.forEach(s => drawBolt(x, s.segs, s.e)); x.restore();
  // brilho do fogo atrás
  x.save(); pt(x, sc); x.globalCompositeOperation = 'lighter';
  g = x.createRadialGradient(540, 700, 0, 540, 700, 760);
  g.addColorStop(0, `rgba(255,70,0,${.26 * clamp(S.fire, 0, 1.3)})`); g.addColorStop(1, 'rgba(255,40,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore();

  blit(x, sc, kit.body);
  if (S.flash > 0) blit(x, sc, kit.body, { op: 'lighter', alpha: S.flash * 1.2 });
  drawFire(x, kit, S);
  blit(x, sc, kit.bloom, { op: 'lighter', alpha: S.fire * .85 });
  drawSmoke(x, kit, S);

  // HALLOWEEN
  const h = S.hallo;
  if (h.a > 0) {
    if (h.trail) [1.24, 1.12].forEach((k, i) => blit(x, sc, kit.hallo, { scale: h.scale * k, alpha: h.a * (.18 - i * .06) }));
    if (S.glitch > 0) {
      const L = kit.hallo, n = 8, hh = L.c.height / n;
      blit(x, sc, kit.halloR, { dx: -10 * S.glitch, alpha: .8, op: 'lighter' });
      blit(x, sc, kit.halloC, { dx: 10 * S.glitch, alpha: .7, op: 'lighter' });
      x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
      for (let i = 0; i < n; i++) {
        const dx = (hash(i + Math.floor(S.time * 20) * 7) - .5) * 60 * S.glitch * sc;
        x.drawImage(L.c, 0, i * hh, L.c.width, hh, (L.ox + SHK.x) * sc + dx, (L.oy + SHK.y) * sc + i * hh, L.c.width, hh);
      }
      x.restore();
    } else blit(x, sc, kit.hallo, { scale: h.scale, alpha: h.a });
  }
  // onda de impacto
  S.shocks.forEach(s => {
    x.save(); pt(x, sc); x.globalCompositeOperation = 'lighter';
    x.strokeStyle = `rgba(255,170,90,${s.a})`; x.lineWidth = s.w;
    x.beginPath(); x.ellipse(540, s.y, s.r, s.r * .42, 0, 0, TAU); x.stroke(); x.restore();
  });
  // Terceirão cromado
  const tc = S.chrome;
  if (tc.a > 0) {
    let img = null;
    if (S.shine >= 0 && S.shine <= 1) {
      const c = kit.shine, cx = c.getContext('2d'), w = c.width, hh = c.height;
      cx.globalCompositeOperation = 'copy'; cx.drawImage(kit.chrome.c, 0, 0);
      cx.globalCompositeOperation = 'source-atop';
      const bx = lerp(-w * .3, w * 1.3, S.shine);
      const gg = cx.createLinearGradient(bx - 140 * sc, 0, bx + 140 * sc, hh * .6);
      gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(.5, 'rgba(255,255,255,.85)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
      cx.fillStyle = gg; cx.fillRect(0, 0, w, hh);
      img = c;
    }
    if (tc.trail) [1.22, 1.1].forEach((k, i) => blit(x, sc, kit.chrome, { scale: tc.scale * k, alpha: tc.a * (.18 - i * .06) }));
    blit(x, sc, kit.chrome, { scale: tc.scale, alpha: tc.a, img });
  }
  drawGlints(x, sc, S);
  drawEmbers(x, sc, S.embers);

  // selo
  if (S.badge.s > 0) {
    [kit.ring, kit.core].forEach((L, i) => {
      x.save(); x.setTransform(sc, 0, 0, sc, (BADGE.x + SHK.x) * sc, (BADGE.y + SHK.y) * sc);
      x.rotate((i ? -.18 : S.badge.rot)); x.scale(S.badge.s, S.badge.s);
      x.setTransform(x.getTransform().scale(1 / sc, 1 / sc));
      x.drawImage(L.c, L.ox * sc, L.oy * sc); x.restore();
    });
  }

  // informações
  if (!S.groups) {
    if (kit.info) blit(x, sc, kit.info); else { x.save(); pt(x, sc); GROUPS.forEach(gr => gr.draw(x)); x.restore(); }
  } else {
    GROUPS.forEach((gr, i) => {
      const s = S.groups[i]; if (s.a <= 0) return;
      x.save(); pt(x, sc); x.globalAlpha = s.a; x.translate(0, s.dy);
      if (gr.stamp && s.k !== 1) { const cy = TY.y0 + 314; x.translate(540, cy); x.scale(s.k, s.k); x.translate(-540, -cy); }
      gr.draw(x); x.restore();
    });
  }
  // abertura
  if (S.intro > 0) {
    x.save(); pt(x, sc); x.globalAlpha = S.intro; x.font = `700 30px ${FB}`; x.fillStyle = BONE;
    spaced(x, 'COLÉGIO POLITÉCNICO APRESENTA', 540, 980, 9, 'center'); x.restore();
  }
  if (S.flash > 0) { x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = `rgba(200,190,255,${S.flash * .2})`; x.fillRect(0, 0, cw, ch); x.restore(); }
  if (kit.overlay) blit(x, sc, kit.overlay, { dx: -SHK.x, dy: -SHK.y });
  else { x.save(); x.setTransform(sc, 0, 0, sc, 0, 0); paintOverlay(x); x.restore(); }
}

/* ---------- estado ---------- */
function glintSpots() {
  const top = TY.tY - TY.tAsc, x0 = TY.tX;
  return [[x0 + TY.tW * .06, top + 22], [x0 + TY.tW * .5, top + TY.tAsc * .42], [x0 + TY.tW * .86, top + 30], [x0 + TY.tW * .3, TY.tY - 18]];
}
function stillState() {
  const r = rng(31), embers = [];
  for (let i = 0; i < 110; i++) {
    const y = 380 + r() * 1100, life = 1, age = .15 + r() * .7;
    embers.push({ x: 80 + r() * 920, y, vx: (r() - .5) * 60, vy: -(80 + r() * 160), s: .8 + r() * 2.6, b: y > 1300 ? .35 : .9, age, life });
  }
  const gs = glintSpots();
  return {
    time: 7.3, fire: 1.05, smoke: 1, flash: 0, glitch: 0, shake: { x: 0, y: 0 }, intro: 0, shine: -1,
    strikes: [],
    hallo: { a: 1, scale: 1 }, chrome: { a: 1, scale: 1 }, shocks: [], groups: null,
    badge: { s: 1, rot: -.35 }, glints: gs.map((g, i) => [g[0], g[1], [1, .7, .85, 0][i]]), embers
  };
}

const live = {
  time: 0, fire: 0, smoke: 0, flash: 0, glitch: 0, shake: { x: 0, y: 0 }, intro: 0, shine: -1, strikes: [],
  hallo: { a: 0, scale: 1 }, chrome: { a: 0, scale: 1 }, shocks: [], groups: null, badge: { s: 0, rot: 0 }, glints: [], embers: []
};
const ctl = { shakeAmp: 0, landedH: false, landedT: false, glitchAt: 0, glitchUntil: 0, shineAt: 0, boltAt: 0, flare: 0, struck: false };
let T = REDUCED ? INTRO : 0, introDone = false, last = 0;

function emit(n, x0, x1, y0, y1, fast) {
  for (let i = 0; i < n; i++) live.embers.push({
    x: lerp(x0, x1, Math.random()), y: lerp(y0, y1, Math.random()), vx: (Math.random() - .5) * (fast ? 420 : 50), vy: -(fast ? 160 + Math.random() * 420 : 60 + Math.random() * 140),
    s: .8 + Math.random() * 2.6, b: .6 + Math.random() * .4, age: 0, life: 1.6 + Math.random() * 2.8, ph: Math.random() * TAU
  });
}
function strike(x1, y1, now) {
  const x0 = clamp(x1 + (Math.random() - .5) * 500, 40, W - 40);
  live.strikes.push({ segs: makeBolt(x0, 0, x1, y1), t0: now, e: 1 });
}
function slam(y, now) {
  ctl.shakeAmp = REDUCED ? 0 : 22;
  live.shocks.push({ y, t0: now, r: 0, a: .6, w: 30 });
  emit(55, 100, 980, y - 60, y + 40, true);
  ctl.flare = .5;
}

function update(dt, now) {
  const t = T, secs = now / 1000;
  live.time = secs;
  // fogo e fumaça
  const ign = introDone ? 1 : ease(span(t, 1.85, 2.4));
  const flick = .86 + .07 * Math.sin(secs * 13.1) + .05 * Math.sin(secs * 23.7 + 1) + .04 * (hash(Math.floor(secs * 18)) - .5);
  ctl.flare *= Math.exp(-dt * 2.5);
  live.fire = ign * (flick + ctl.flare) + (introDone ? 0 : .7 * Math.max(0, Math.sin(span(t, 1.85, 2.3) * Math.PI)));
  live.smoke = introDone ? 1 : .35 + .65 * ease(span(t, 0, 2.2));
  // abertura
  live.intro = introDone ? 0 : span(t, .25, .7) * (1 - span(t, 1.35, 1.7));
  const slamOf = (st, t0, key, y) => {
    const p = span(t, t0, t0 + .24);
    st.a = introDone ? 1 : Math.min(1, p * 3);
    st.scale = introDone || p >= 1 ? 1 : lerp(1.9, 1, p * p);
    st.trail = !introDone && p > 0 && p < 1;
    if (!introDone && p >= 1 && !ctl[key]) { ctl[key] = true; slam(y, now); }
  };
  slamOf(live.hallo, 2.45, 'landedH', TY.hY - TY.hCap / 2);
  slamOf(live.chrome, 2.95, 'landedT', TY.tY - TY.tAsc / 2);
  if (!introDone) {
    if (t > 1.15 && !ctl.struck) { ctl.struck = true; strike(300 + Math.random() * 480, 560, now); }
    live.badge.s = t < 3.2 ? 0 : 1 + Math.sin(span(t, 3.2, 3.7) * Math.PI) * .35 * (1 - span(t, 3.2, 3.7));
    live.groups = GROUPS.map(gr => { const p = ease(span(t, gr.t0, gr.t0 + .45)); return { a: p, dy: (1 - p) * 46, k: gr.stamp ? lerp(1.25, 1, p) : 1 }; });
  } else live.badge.s = 1;
  live.badge.rot += dt * (REDUCED ? 0 : .35);
  // glitch e brilho do cromo
  if (introDone && now > ctl.glitchAt) { ctl.glitchUntil = now + 220; ctl.glitchAt = now + 3800 + Math.random() * 4000; }
  live.glitch = now < ctl.glitchUntil ? 1 : 0;
  if (introDone && now > ctl.shineAt) ctl.shineAt = now + 5200 + Math.random() * 2500;
  const sp = 1 - (ctl.shineAt - now) / 900;
  live.shine = !introDone ? (t > 3.35 ? span(t, 3.35, 4.25) : -1) : (sp >= 0 && sp <= 1 ? sp : -1);
  const gs = glintSpots();
  live.glints = gs.map((g, i) => [g[0], g[1], live.chrome.a < 1 ? 0 : Math.max(0, Math.sin(secs * 1.9 + i * 1.7)) ** 6 * 1.1]);
  // raios
  if (introDone && !REDUCED && now > ctl.boltAt) { strike(150 + Math.random() * 780, 300 + Math.random() * 400, now); ctl.boltAt = now + 7000 + Math.random() * 8000; }
  let flash = 0;
  live.strikes.forEach(s => {
    const p = (now - s.t0) / 1000;
    s.e = p < .06 ? 1 : p < .12 ? .25 : p < .2 ? .9 : Math.max(0, 1 - (p - .2) / .3);
    flash = Math.max(flash, s.e);
  });
  live.strikes = live.strikes.filter(s => s.e > 0);
  live.flash = flash * .9;
  // tremida e ondas
  ctl.shakeAmp *= Math.exp(-dt * 8);
  live.shake.x = (Math.random() - .5) * 2 * ctl.shakeAmp; live.shake.y = (Math.random() - .5) * 2 * ctl.shakeAmp;
  live.shocks.forEach(s => { const p = (now - s.t0) / 650; s.r = ease(p) * 760; s.a = .6 * (1 - p); s.w = 30 * (1 - p) + 2; });
  live.shocks = live.shocks.filter(s => s.a > 0);
  // brasas
  if (ign > 0 && !REDUCED) { live.ember = (live.ember || 0) + dt * 34 * ign; while (live.ember > 1) { live.ember--; emit(1, 140, 940, 700, 1000); } }
  live.embers.forEach(p => { p.age += dt; p.vx += Math.sin(p.age * 3 + p.ph) * 40 * dt; p.vx *= Math.exp(-dt * .8); p.vy *= Math.exp(-dt * .3); p.x += p.vx * dt; p.y += p.vy * dt; });
  live.embers = live.embers.filter(p => p.age < p.life && p.y > -20);
}

/* ---------- laço ---------- */
const cv = document.getElementById('poster'), ctx = cv.getContext('2d');
let kit = null;
function fit() {
  const vv = window.visualViewport, vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
  const s = Math.min(vw / W, (vh - 92) / H), dw = Math.floor(W * s), dh = Math.floor(H * s);
  cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
  const sc = clamp(dw * Math.min(window.devicePixelRatio || 1, 3) / W, .3, 1.2);
  if (!kit || Math.abs(kit.sc - sc) > .02) { cv.width = Math.round(W * sc); cv.height = Math.round(H * sc); kit = buildKit(sc, true); }
}
function finishIntro(now) {
  if (introDone) return;
  T = Math.max(T, INTRO); introDone = true; live.groups = null;
  if (!ctl.landedH) { ctl.landedH = ctl.landedT = true; slam(TY.hY, now); }
  ctl.glitchAt = now + 2500; ctl.shineAt = now + 3000; ctl.boltAt = now + 5000;
  const h = document.getElementById('hint');
  h.textContent = (TOUCH ? 'toque' : 'clique') + ' na tela pra soltar um raio ⚡';
  h.classList.add('on'); document.getElementById('bar').classList.add('on');
  setTimeout(() => h.classList.remove('on'), 8000);
  setTimeout(prepareShare, 1500);
}
function frame(now) {
  const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
  if (!introDone) { T += dt; if (T >= INTRO) finishIntro(now); }
  update(dt, now);
  render(ctx, kit, live);
  requestAnimationFrame(frame);
}

/* ---------- toque: raio, tremida, brasa e um trovão ---------- */
let AC = null;
function thunder() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime, len = AC.sampleRate * 1.8 | 0, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
    const src = AC.createBufferSource(); src.buffer = buf;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2200, t); lp.frequency.exponentialRampToValueAtTime(110, t + 1.3);
    const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.42, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8);
    src.connect(lp); lp.connect(g); g.connect(AC.destination); src.start(t);
    const o = AC.createOscillator(), og = AC.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(30, t + .7);
    og.gain.setValueAtTime(.0001, t); og.gain.exponentialRampToValueAtTime(.5, t + .01); og.gain.exponentialRampToValueAtTime(.0001, t + .8);
    o.connect(og); og.connect(AC.destination); o.start(t); o.stop(t + .85);
  } catch (e) { /* sem som, tudo bem */ }
}
function toPoster(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  const now = performance.now();
  if (!introDone) { finishIntro(now); return; }
  const p = toPoster(e);
  strike(p.x, Math.min(p.y, 1300), now);
  ctl.shakeAmp = REDUCED ? 0 : 16; ctl.flare = .6; ctl.glitchUntil = now + 160;
  emit(40, p.x - 60, p.x + 60, p.y - 30, p.y + 30, true);
  thunder();
});
window.addEventListener('keydown', e => { if (!introDone && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) finishIntro(performance.now()); });

const toastEl = document.getElementById('toast'); let toastTm;

function download(blob) {

try {

});

/* ---------- início ---------- */
async function boot() {
  try { await Promise.all([document.fonts.load(`100px ${FA}`), document.fonts.load(`900 100px ${FG}`), document.fonts.load(`500 30px ${FB}`), document.fonts.load(`600 30px ${FB}`), document.fonts.load(`700 30px ${FB}`)]); } catch (e) {}

  fit();

  if (REDUCED) finishIntro(performance.now());
  else { const h = document.getElementById('hint'); h.textContent = TOUCH ? 'toque para pular' : 'clique para pular'; h.classList.add('on'); }
  window.__convite = { exportPNG, ready: true, seek: t => { T = t; } };
  requestAnimationFrame(frame);
}
