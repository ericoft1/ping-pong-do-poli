:root{--ink:#07060a;--bone:#efe8d8;--ember:#ff6a1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:"JetBrains Mono",ui-monospace,monospace;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#poster{display:block;touch-action:none;cursor:crosshair;background:var(--ink)}
.dock{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:68px}
.hint{font:400 11px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(239,232,216,.5);opacity:0;transition:opacity 1.2s ease}
.hint.on{opacity:1}
.bar{display:flex;gap:8px;opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.bar.on{opacity:1;transform:none;pointer-events:auto}
.bar button{appearance:none;margin:0;font:500 11px/1 "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);background:rgba(239,232,216,.03);border:1px solid rgba(239,232,216,.24);padding:12px 15px;border-radius:2px;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.bar button:hover{border-color:var(--ember);color:#fff}
.bar button.primary{background:var(--ember);border-color:var(--ember);color:#160702}
.bar button.primary:hover{background:#ff7d36;color:#160702}
.bar button[hidden]{display:none}
.bar button:disabled{opacity:.55;cursor:progress}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-8px);font:500 11px/1.2 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);background:rgba(10,8,12,.88);border:1px solid rgba(239,232,216,.18);padding:10px 14px;border-radius:2px;opacity:0;transition:opacity .3s ease,transform .3s ease;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="poster" role="img" aria-label="Convite: Festa de Halloween do Colégio Politécnico, Ensino Médio. Quinta-feira, 29 de outubro, às 14h, no Anfiteatro do Colégio Politécnico. Lanche coletivo: cada participante deve levar um alimento para compartilhar. Fantasias: participe fantasiado, as melhores serão premiadas. Para o corpo docente, a direção e os estudantes do Ensino Médio."></canvas>
<div class="dock">
  <div class="hint" id="hint"></div>
  <div class="bar" id="bar">
    <button class="primary" id="share" hidden>Enviar no WhatsApp</button>
    <button id="save">Baixar PNG</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';

/* ---------- constantes ---------- */
const W = 1080, H = 1920, TAU = Math.PI * 2;
const INK = '#07060a', BONE = '#efe8d8', EMBER = '#ff6a1a';
const FD = '"Big Shoulders Display", Impact, sans-serif';
const FS = '"Instrument Serif", Georgia, serif';
const FM = '"JetBrains Mono", ui-monospace, monospace';
const FILE = 'convite-halloween-politecnico.png';
const SHARE_TEXT = 'Festa de Halloween · quinta, 29/10, às 14h, no Anfiteatro do Colégio Politécnico. Venha fantasiado e leve um alimento para compartilhar!';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INTRO = 5.0;
const TOUCH = matchMedia('(pointer: coarse)').matches;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const span = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIO = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const bump = (t, a, b) => { const p = span(t, a, b); return Math.sin(p * Math.PI); };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const layer = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const bone = a => `rgba(239,232,216,${a})`;

/* texto com espaçamento entre letras (canvas não tem tracking em todo navegador) */
function spaced(x, str, px, py, track, align = 'left') {
  x.textAlign = 'left';
  const ch = [...str], ws = ch.map(c => x.measureText(c).width);
  const total = ws.reduce((a, b) => a + b, 0) + track * (ch.length - 1);
  let cx = align === 'center' ? px - total / 2 : align === 'right' ? px - total : px;
  ch.forEach((c, i) => { x.fillText(c, cx, py); cx += ws[i] + track; });
  return total;
}

/* ---------- layout (depende das métricas das fontes) ---------- */
let L;
function makeLayout() {
  const m = layer(4, 4).getContext('2d');
  const M = 72, CW = W - M * 2;
  const capOf = (font, s = 'H') => { m.font = font; return m.measureText(s).actualBoundingBoxAscent; };

  m.font = `900 100px ${FD}`;
  const tm = m.measureText('HALLOWEEN');
  const TS = 100 * CW / (tm.actualBoundingBoxLeft + tm.actualBoundingBoxRight);
  m.font = `900 ${TS}px ${FD}`;
  const t2 = m.measureText('HALLOWEEN');
  const titleX = W / 2 - (t2.actualBoundingBoxRight - t2.actualBoundingBoxLeft) / 2;
  const titleCap = t2.actualBoundingBoxAscent;
  const VS = 150, valCap = capOf(`900 ${VS}px ${FD}`, '2914');

  const Y = {};
  Y.festa = capOf(`italic 78px ${FS}`, 'F');
  Y.title = Y.festa + 34 + titleCap;
  Y.tag = Y.title + 84;
  Y.rule1 = Y.tag + 50;
  Y.dLabel = Y.rule1 + 50;
  Y.dValue = Y.dLabel + 28 + valCap;
  Y.rule2 = Y.dValue + 38;
  Y.local = Y.rule2 + 60;
  Y.rule3 = Y.local + 36;
  Y.nLabel = Y.rule3 + 54;
  Y.n1 = Y.nLabel + 54;
  Y.n2 = Y.n1 + 46;
  Y.rule4 = Y.n2 + 38;
  Y.foot = Y.rule4 + 60;
  const off = H - 104 - (Y.foot + 10);
  for (const k in Y) Y[k] += off;
  Y.top = 124; Y.topRule = 152;

  const z0 = Y.topRule + 24, z1 = Y.festa - 54 - 30;
  const cx = W / 2, cy = Math.round((z0 + z1) / 2);
  const R = Math.min((z1 - z0) / 2 - 48, 400);
  const ew = R * 0.92, eh = ew * 0.48, ri = eh * 0.95;
  L = { M, CW, TS, titleX, VS, Y, z0, z1, eye: { cx, cy, R, ew, eh, ri, mx: ew * 0.42, my: eh * 0.22 } };
}

/* ---------- texturas ---------- */
function makeIris(ri, sc) {
  const S = Math.ceil(ri * 2 * sc) + 2, c = layer(S, S), x = c.getContext('2d');
  const r = rng(1029);
  x.scale(sc, sc); x.translate(ri + 1 / sc, ri + 1 / sc);
  let g = x.createRadialGradient(0, 0, 0, 0, 0, ri);
  [[0, '#fff4c8'], [.1, '#ffe27e'], [.28, '#ffae30'], [.5, '#ff7615'], [.7, '#dc4b07'], [.85, '#7c1e02'], [.94, '#2d0900'], [1, '#130300']]
    .forEach(([o, col]) => g.addColorStop(o, col));
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, ri, 0, TAU); x.fill();
  x.save(); x.beginPath(); x.arc(0, 0, ri, 0, TAU); x.clip();
  x.lineCap = 'round';
  for (let i = 0; i < 1500; i++) {
    const a = r() * TAU, r0 = ri * (.05 + r() * .3), r1 = ri * (.5 + r() * .48);
    const bend = (r() - .5) * .2, mid = (r0 + r1) / 2, light = r() < .55;
    x.strokeStyle = light
      ? `rgba(255,${190 + (r() * 60 | 0)},${100 + (r() * 100 | 0)},${.04 + r() * .17})`
      : `rgba(${60 + (r() * 50 | 0)},${8 + (r() * 20 | 0)},0,${.06 + r() * .24})`;
    x.lineWidth = (.35 + r() * (light ? 1.1 : 1.7)) * ri / 150;
    x.beginPath();
    x.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
    x.quadraticCurveTo(Math.cos(a + bend) * mid, Math.sin(a + bend) * mid, Math.cos(a + bend * .4) * r1, Math.sin(a + bend * .4) * r1);
    x.stroke();
  }
  for (let i = 0; i < 80; i++) {
    const a = r() * TAU, rr = ri * (.46 + r() * .42);
    x.save(); x.translate(Math.cos(a) * rr, Math.sin(a) * rr); x.rotate(a);
    x.fillStyle = `rgba(48,8,0,${.12 + r() * .24})`;
    x.beginPath(); x.ellipse(0, 0, ri * (.02 + r() * .05), ri * (.007 + r() * .016), 0, 0, TAU); x.fill();
    x.restore();
  }
  x.beginPath();
  for (let i = 0; i <= 200; i++) {
    const a = i / 200 * TAU, rr = ri * (.4 + .035 * Math.sin(a * 9 + 1.3) + .018 * Math.sin(a * 23 + .4));
    i ? x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : x.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  x.closePath(); x.strokeStyle = 'rgba(255,228,160,.36)'; x.lineWidth = ri * .012; x.stroke();
  x.globalCompositeOperation = 'lighter';
  g = x.createRadialGradient(0, 0, 0, 0, 0, ri * .5);
  g.addColorStop(0, 'rgba(255,205,100,.34)'); g.addColorStop(1, 'rgba(255,140,40,0)');
  x.fillStyle = g; x.fillRect(-ri, -ri, ri * 2, ri * 2);
  g = x.createRadialGradient(0, ri * .62, 0, 0, ri * .62, ri * .62);
  g.addColorStop(0, 'rgba(255,186,80,.26)'); g.addColorStop(1, 'rgba(255,140,40,0)');
  x.fillStyle = g; x.fillRect(-ri, -ri, ri * 2, ri * 2);
  x.globalCompositeOperation = 'source-over';
  g = x.createRadialGradient(0, 0, ri * .78, 0, 0, ri);
  g.addColorStop(0, 'rgba(10,2,0,0)'); g.addColorStop(.7, 'rgba(10,2,0,.5)'); g.addColorStop(1, 'rgba(5,1,0,.96)');
  x.fillStyle = g; x.fillRect(-ri, -ri, ri * 2, ri * 2);
  x.restore();
  return c;
}

function makeSclera(ew, eh, sc) {
  const w = ew * 2, h = eh * 2.4, c = layer(w * sc, h * sc), x = c.getContext('2d');
  const r = rng(31);
  x.scale(sc, sc);
  const cx = ew, cy = h / 2;
  x.save(); x.translate(cx, cy); x.scale(1, .55);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, ew);
  g.addColorStop(0, '#7e2709'); g.addColorStop(.42, '#4c1305'); g.addColorStop(.78, '#1f0703'); g.addColorStop(1, '#0a0202');
  x.fillStyle = g; x.fillRect(-ew, -h, w, h * 2);
  x.restore();
  x.lineCap = 'round';
  const vein = (px, py, ang, wd, steps) => {
    for (let s = 0; s < steps && wd > .25; s++) {
      const len = ew * .028 * (.6 + r());
      const nx = px + Math.cos(ang) * len, ny = py + Math.sin(ang) * len;
      x.lineWidth = wd; x.beginPath(); x.moveTo(px, py); x.lineTo(nx, ny); x.stroke();
      px = nx; py = ny; ang += (r() - .5) * .7; wd *= .93;
      if (r() < .1) vein(px, py, ang + (r() < .5 ? -.7 : .7), wd * .7, steps * .5 | 0);
    }
  };
  for (let i = 0; i < 26; i++) {
    const side = i % 2 ? 1 : -1;
    x.strokeStyle = `rgba(${150 + (r() * 70 | 0)},${18 + (r() * 24 | 0)},8,${.22 + r() * .3})`;
    vein(cx + side * ew * (.97 - r() * .12), cy + (r() - .5) * eh * 1.1, (side > 0 ? Math.PI : 0) + (r() - .5) * .9, (1.2 + r() * 1.3) * ew / 260, 14 + (r() * 18 | 0));
  }
  return c;
}

function makeGrain(amp = 14) {
  const S = 256, c = layer(S, S), x = c.getContext('2d'), img = x.createImageData(S, S), d = img.data;
  const r = rng(77);
  for (let i = 0; i < d.length; i += 4) {
    const v = r(), on = v > .5 ? 255 : 0;
    d[i] = d[i + 1] = d[i + 2] = on; d[i + 3] = (Math.abs(v - .5) * 2) * amp | 0;
  }
  x.putImageData(img, 0, 0);
  return c;
}

function drawRegMark(x, px, py) {

function annotation(x, ang, dir, text, below) {
  const { cx, cy, R } = L.eye;
  const p0 = [cx + Math.cos(ang) * (R + 30), cy + Math.sin(ang) * (R + 30)];
  const p1 = [p0[0] + dir * 34, p0[1] + (below ? 34 : -34)];
  const end = dir > 0 ? W - L.M : L.M;
  x.strokeStyle = bone(.34); x.lineWidth = 1.2;
  x.beginPath(); x.moveTo(p0[0], p0[1]); x.lineTo(p1[0], p1[1]); x.lineTo(end, p1[1]); x.stroke();
  x.fillStyle = EMBER; x.beginPath(); x.arc(p0[0], p0[1], 3.5, 0, TAU); x.fill();
  x.fillStyle = bone(.6); x.font = `500 17px ${FM}`;
  spaced(x, text, end, p1[1] + (below ? 30 : -14), 2.6, dir > 0 ? 'right' : 'left');
}

function drawDiagram(x) {
  const { cx, cy, R } = L.eye, M = L.M;
  x.save();
  x.lineCap = 'butt';
  x.strokeStyle = bone(.3); x.lineWidth = 1.3;
  x.beginPath(); x.arc(cx, cy, R, 0, TAU); x.stroke();
  for (let d = 0; d < 360; d += 2) {
    const a = d * Math.PI / 180, major = d % 30 === 0, mid = d % 10 === 0;
    const r0 = R + 6, r1 = R + (major ? 24 : mid ? 15 : 10);
    x.strokeStyle = bone(major ? .62 : mid ? .38 : .2);
    x.beginPath(); x.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); x.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); x.stroke();
  }
  // mira horizontal com régua
  x.strokeStyle = bone(.22); x.lineWidth = 1.2;
  x.beginPath();
  x.moveTo(M, cy); x.lineTo(cx - R - 40, cy);
  x.moveTo(cx + R + 40, cy); x.lineTo(W - M, cy);
  x.stroke();
  x.strokeStyle = bone(.16);
  x.beginPath();
  for (let px = M; px <= cx - R - 44; px += 16) { x.moveTo(px, cy - 4); x.lineTo(px, cy + 4); }
  for (let px = W - M; px >= cx + R + 44; px -= 16) { x.moveTo(px, cy - 4); x.lineTo(px, cy + 4); }
  x.stroke();
  x.strokeStyle = bone(.45);
  x.beginPath(); x.moveTo(M, cy - 11); x.lineTo(M, cy + 11); x.moveTo(W - M, cy - 11); x.lineTo(W - M, cy + 11); x.stroke();
  annotation(x, -50 * Math.PI / 180, 1, 'ALVO: SUA FANTASIA', false);
  annotation(x, 140 * Math.PI / 180, -1, 'FIG. 01 — O OBSERVADOR', true);
  // marcas de registro
  x.strokeStyle = bone(.28); x.lineWidth = 1;
  drawRegMark(x, 40, 40); drawRegMark(x, W - 40, 40); drawRegMark(x, 40, H - 40); drawRegMark(x, W - 40, H - 40);
  x.restore();
}

/* ---------- desenho dinâmico ---------- */
function almond(x, cx, cy, ew, up, lo) {
  const k = 4 / 3;
  x.moveTo(cx - ew, cy);
  x.bezierCurveTo(cx - ew * .5, cy - up * k, cx + ew * .42, cy - up * k * 1.02, cx + ew, cy);
  x.bezierCurveTo(cx + ew * .5, cy + lo * k, cx - ew * .42, cy + lo * k, cx - ew, cy);
}
function upperLid(x, cx, cy, ew, up) {
  const k = 4 / 3;
  x.moveTo(cx - ew, cy);
  x.bezierCurveTo(cx - ew * .5, cy - up * k, cx + ew * .42, cy - up * k * 1.02, cx + ew, cy);
}
function lowerLid(x, cx, cy, ew, lo) {
  const k = 4 / 3;
  x.moveTo(cx + ew, cy);
  x.bezierCurveTo(cx + ew * .5, cy + lo * k, cx - ew * .42, cy + lo * k, cx - ew, cy);
}
function slit(x, w, h) {
  x.beginPath();
  x.moveTo(0, -h);
  x.bezierCurveTo(w * 1.33, -h * .45, w * 1.33, h * .45, 0, h);
  x.bezierCurveTo(-w * 1.33, h * .45, -w * 1.33, -h * .45, 0, -h);
}

function drawHalo(x, a) {

  x.fillStyle = g; x.fillRect(0, 0, W, H);
}

function drawVignette(x) {

}

function drawRings(x, a, dash, sweep) {
  if (a <= 0) return;
  const { cx, cy, R } = L.eye;
  x.save();
  if (x.createConicGradient) {
    const trail = 1.1, g = x.createConicGradient(sweep - trail, cx, cy);
    g.addColorStop(0, 'rgba(255,106,26,0)');
    g.addColorStop(trail / TAU, `rgba(255,106,26,${.3 * a})`);
    g.addColorStop(trail / TAU + .002, 'rgba(255,106,26,0)');
    g.addColorStop(1, 'rgba(255,106,26,0)');
    x.fillStyle = g;
    x.beginPath(); x.arc(cx, cy, R + 28, 0, TAU); x.arc(cx, cy, R + 3, 0, TAU, true); x.fill();
  }
  x.translate(cx, cy); x.rotate(dash);

  x.beginPath(); x.arc(0, 0, R + 36, 0, TAU); x.stroke();

  x.fillStyle = `rgba(255,106,26,${.9 * a})`;
  x.beginPath(); x.moveTo(R + 36, -6); x.lineTo(R + 46, 0); x.lineTo(R + 36, 6); x.closePath(); x.fill();
  x.restore();
}

function drawSmallEye(x, px, py, s, kind, b, open, lx, ly, side) {
  const hh = s * (kind === 'round' ? .86 : kind === 'slit' ? .56 : .32) * open;
  if (hh < .4) return;
  const tilt = kind === 'narrow' ? side * .24 : kind === 'slit' ? side * .1 : 0;
  x.save(); x.translate(px, py); x.rotate(tilt);
  x.beginPath();
  if (kind === 'round') x.ellipse(0, 0, s * .86, hh, 0, 0, TAU);
  else { x.moveTo(-s, 0); x.quadraticCurveTo(0, -hh * 2, s, 0); x.quadraticCurveTo(0, hh * 2, -s, 0); }
  const g = x.createRadialGradient(0, 0, 0, 0, 0, s);
  g.addColorStop(0, `rgba(255,228,140,${b})`); g.addColorStop(.55, `rgba(255,128,32,${b})`); g.addColorStop(1, `rgba(150,36,0,${b})`);
  x.fillStyle = g; x.fill();
  x.clip();
  const ox = lx * s * .32, oy = ly * s * .14;
  x.fillStyle = 'rgba(8,2,0,.92)';
  x.beginPath();
  if (kind === 'round') x.arc(ox, oy, s * .34, 0, TAU);
  else x.ellipse(ox, oy, s * (kind === 'slit' ? .13 : .1), s * .9, 0, 0, TAU);
  x.fill();
  const sh = x.createLinearGradient(0, -hh, 0, hh * .5);
  sh.addColorStop(0, 'rgba(0,0,0,.55)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = sh; x.fillRect(-s, -hh, s * 2, hh * 1.5);
  x.fillStyle = `rgba(255,246,228,${.85 * b})`;
  x.beginPath(); x.arc(-s * .28 + ox * .3, -hh * .28, Math.max(.8, s * .09), 0, TAU); x.fill();
  x.restore();
}

function drawPair(x, e, st) {
  const { x: px, y: py, s, kind, b } = e, open = st.open;
  if (open < .02) return;
  const gap = s * (kind === 'round' ? 1.25 : 1.35);
  x.save();
  x.globalCompositeOperation = 'lighter';
  const R = s * 4.4, g = x.createRadialGradient(px, py, 0, px, py, R);
  g.addColorStop(0, `rgba(255,110,30,${.15 * b * open})`); g.addColorStop(1, 'rgba(255,90,20,0)');
  x.fillStyle = g; x.fillRect(px - R, py - R, R * 2, R * 2);
  x.restore();
  drawSmallEye(x, px - gap, py, s, kind, b, open, st.lx, st.ly, -1);
  drawSmallEye(x, px + gap, py, s, kind, b, open, st.lx, st.ly, 1);
}

function drawBigEye(x, kit, S) {
  const { cx, cy, ew, eh, ri, mx, my } = L.eye;
  const o = clamp(S.open, 0, 1), glow = S.glow;
  // brilho que vaza do olho
  if (glow > .001) {
    x.save(); x.globalCompositeOperation = 'lighter';
    x.translate(cx, cy); x.scale(1, .62);
    const g = x.createRadialGradient(0, 0, 0, 0, 0, ew * 2.2);
    g.addColorStop(0, `rgba(255,104,26,${.32 * glow})`); g.addColorStop(.33, `rgba(255,80,16,${.12 * glow})`); g.addColorStop(1, 'rgba(255,60,10,0)');
    x.fillStyle = g; x.fillRect(-ew * 2.2, -ew * 2.2, ew * 4.4, ew * 4.4);
    x.restore();
  }
  // dobras da pele, iluminadas pelo olho
  x.save(); x.lineCap = 'round';
  const fold = (ext, h, dy, a, w) => {
    const g = x.createLinearGradient(cx - ew * ext, 0, cx + ew * ext, 0);
    g.addColorStop(0, 'rgba(255,130,50,0)'); g.addColorStop(.5, `rgba(255,130,50,${a})`); g.addColorStop(1, 'rgba(255,130,50,0)');
    x.strokeStyle = g; x.lineWidth = w;
    x.beginPath(); upperLid(x, cx, cy + dy, ew * ext, h); x.stroke();
  };
  const openUp = lerp(eh * .55, eh, o);
  fold(1.14, openUp * 1.28 + 30, -eh * .04, .26 * (.4 + .6 * glow), 2.2);
  fold(1.22, openUp * 1.5 + 62, -eh * .08, .12 * (.4 + .6 * glow), 1.6);
  {
    const g = x.createLinearGradient(cx - ew, 0, cx + ew, 0);
    g.addColorStop(0, 'rgba(255,130,50,0)'); g.addColorStop(.5, `rgba(255,130,50,${.15 * (.4 + .6 * glow)})`); g.addColorStop(1, 'rgba(255,130,50,0)');
    x.strokeStyle = g; x.lineWidth = 1.6;
    x.beginPath(); lowerLid(x, cx, cy + eh * .04, ew * 1.04, eh * .8 + 26); x.stroke();
  }
  x.restore();

  const up = lerp(-.16 * eh, eh, o), lo = lerp(.16 * eh, eh * .8, o);
  if (o < .03) {
    x.strokeStyle = `rgba(255,130,50,${.35 * glow + .1})`; x.lineWidth = 2;
    x.beginPath(); lowerLid(x, cx, cy, ew, lo); x.stroke();
    return;
  }
  x.save();
  x.beginPath(); almond(x, cx, cy, ew, up, lo); x.clip();
  x.drawImage(kit.sclera, cx - ew, cy - eh * 1.2, ew * 2, eh * 2.4);
  const ix = cx + S.lx * mx, iy = cy + S.ly * my;
  x.save();
  x.translate(ix, iy); x.scale(1 - .1 * Math.abs(S.lx), 1 - .05 * Math.abs(S.ly));
  x.drawImage(kit.iris, -ri - 1, -ri - 1, ri * 2 + 2, ri * 2 + 2);
  const pw = ri * S.pupil, ph = ri * .9;
  [[2.1, .1], [1.65, .14], [1.3, .22]].forEach(([k, a]) => { x.fillStyle = `rgba(28,4,0,${a})`; slit(x, pw * k + ri * .01, ph * (1 + (k - 1) * .04)); x.fill(); });
  x.fillStyle = '#040101'; slit(x, pw, ph); x.fill();
  x.restore();
  // sombras das pálpebras
  let g = x.createLinearGradient(0, cy - up, 0, cy - up + eh * .75);
  g.addColorStop(0, 'rgba(0,0,0,.8)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(cx - ew, cy - eh * 1.2, ew * 2, eh * 2);
  g = x.createLinearGradient(0, cy + lo, 0, cy + lo - eh * .35);
  g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(cx - ew, cy, ew * 2, eh * 1.2);
  x.save(); x.translate(cx, cy); x.scale(1, eh / ew);
  g = x.createRadialGradient(0, 0, ew * .5, 0, 0, ew);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
  x.fillStyle = g; x.fillRect(-ew, -ew, ew * 2, ew * 2);
  x.restore();
  // reflexos na córnea
  const hx = cx + S.lx * mx * .55 - ri * .34, hy = cy + S.ly * my * .55 - ri * .36;
  x.save(); x.globalCompositeOperation = 'lighter';
  x.translate(hx, hy); x.rotate(-.35);
  x.fillStyle = 'rgba(255,236,214,.16)';
  x.beginPath(); x.ellipse(0, 0, ri * .2, ri * .11, 0, 0, TAU); x.fill();
  x.restore();
  x.fillStyle = 'rgba(255,250,240,.9)';
  x.beginPath(); x.arc(hx + ri * .05, hy + ri * .02, ri * .045, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,250,240,.45)';
  x.beginPath(); x.arc(hx + ri * .5, hy + ri * .62, ri * .02, 0, TAU); x.fill();
  x.restore();
  // bordas das pálpebras
  x.save(); x.lineCap = 'round';
  x.strokeStyle = 'rgba(0,0,0,.9)'; x.lineWidth = eh * .07;
  x.beginPath(); upperLid(x, cx, cy, ew, up); x.stroke();
  x.strokeStyle = `rgba(255,150,70,${.2 * glow})`; x.lineWidth = 1.5;
  x.beginPath(); upperLid(x, cx, cy - eh * .045, ew * 1.01, up); x.stroke();
  x.strokeStyle = `rgba(255,196,128,${.4 * glow})`; x.lineWidth = 1.6;
  x.beginPath(); lowerLid(x, cx, cy - 1, ew * .99, lo); x.stroke();
  x.restore();
}

/* ---------- composição de um quadro ---------- */
function render(x, kit, S) {
  const sc = kit.sc, cw = x.canvas.width, ch = x.canvas.height;
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  x.fillStyle = INK; x.fillRect(0, 0, cw, ch);
  x.setTransform(sc, 0, 0, sc, 0, 0);
  drawHalo(x, S.halo);
  EYES.forEach((e, i) => drawPair(x, e, S.small[i]));
  drawBigEye(x, kit, S.eye);
  drawVignette(x);
  drawRings(x, S.reveal, S.dash, S.sweep);

  if (S.reveal > 0) {
    x.save();
    if (S.reveal < 1) { x.beginPath(); x.arc(L.eye.cx, L.eye.cy, S.reveal * 1500, 0, TAU); x.clip(); }
    if (kit.diag) { x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(kit.diag, 0, 0); } else drawDiagram(x);
    x.restore();
  }

  x.setTransform(sc, 0, 0, sc, 0, 0);
  if (!S.groups) {
    if (kit.text) { x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(kit.text, 0, 0); }
    else GROUPS.forEach(gr => gr.draw(x));
  } else {
    GROUPS.forEach((gr, i) => {
      const s = S.groups[i]; if (s.a <= 0) return;
      x.save(); x.globalAlpha = s.a; x.translate(0, s.dy); gr.draw(x); x.restore();
    });
  }

  x.setTransform(1, 0, 0, 1, 0, 0);
  x.fillStyle = kit.grainPat; x.fillRect(0, 0, cw, ch);
}

function buildKit(sc, cache, target, grain = GRAIN) {
  const kit = { sc };
  kit.iris = makeIris(L.eye.ri, sc);
  kit.sclera = makeSclera(L.eye.ew, L.eye.eh, sc);
  kit.grainPat = target.createPattern(grain, 'repeat');
  if (cache) {
    kit.diag = layer(W * sc, H * sc);
    const d = kit.diag.getContext('2d'); d.scale(sc, sc); drawDiagram(d);
    kit.text = layer(W * sc, H * sc);
    const t = kit.text.getContext('2d'); t.scale(sc, sc); GROUPS.forEach(g => g.draw(t));
  }
  return kit;
}

/* estado final, usado no PNG */
function stillState() {
  return {
    halo: 1, reveal: 1, dash: .12, sweep: -.95, groups: null,
    eye: { open: 1, lx: 0, ly: 0, pupil: .15, glow: 1 },
    small: EYES.map(e => ({ open: 1, lx: clamp((L.eye.cx - e.x) / 600, -1, 1) * .6, ly: clamp((L.eye.cy - e.y) / 600, -1, 1) * .5 }))
  };
}

/* ---------- ao vivo ---------- */
const cv = document.getElementById('poster');
const ctx = cv.getContext('2d');
let GRAIN, kit = null, T = REDUCED ? INTRO : 0, last = 0, introDone = false;
const live = {
  halo: 0, reveal: 0, dash: 0, sweep: -1.2, groups: GROUPS.map(() => ({ a: 0, dy: 0 })),
  eye: { open: 0, lx: -.55, ly: .35, pupil: .34, glow: 0 }, small: []
};
const eyeCtl = { tlx: 0, tly: 0, nextLook: 0, blinkAt: 0, blinkStart: -1e9, double: false, flash: 0, squint: 1 };
const ptr = { x: W / 2, y: H / 2, at: -1e9 };

function fit() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
  const s = Math.min(vw / W, (vh - 92) / H);
  const dw = Math.floor(W * s), dh = Math.floor(H * s);
  cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const sc = clamp(dw * dpr / W, .3, 1.5);
  if (!kit || Math.abs(kit.sc - sc) > .02) {
    cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
    kit = buildKit(sc, true, ctx);
  }
}

function introUpdate() {
  const t = T;
  EYES.forEach((e, i) => {
    const st = live.small[i];
    st.base = ease(span(t, e.st.delay, e.st.delay + .35)); st.open = st.base;
    st.lx = Math.sin(t * .6 + e.st.phase) * .4; st.ly = 0;
  });
  const E = live.eye;
  E.open = .3 * ease(span(t, 1.6, 2.0)) + .7 * ease(span(t, 2.3, 2.9));
  const look = ease(span(t, 2.75, 2.95));
  E.lx = lerp(-.55, 0, look); E.ly = lerp(.35, 0, look);
  E.pupil = lerp(.34, .15, ease(span(t, 2.6, 3.8)));
  E.glow = E.open * (1 + .7 * bump(t, 2.4, 3.5));
  live.halo = ease(span(t, 1.6, 3.2));
  live.reveal = easeIO(span(t, 2.6, 3.7));
  GROUPS.forEach((gr, i) => {
    const s = live.groups[i], p = span(t, gr.t0, gr.t0 + .8);
    s.a = ease(p); s.dy = (1 - ease(p)) * 22;
    if (gr.flicker && p > 0 && p < 1) {
      const k = Math.floor(t * 26), h = Math.sin(k * 12.9898) * 43758.5453;
      s.a = (h - Math.floor(h)) < .55 + p * .4 ? 1 : .12; s.dy = 0;
    }
  });
}

function finishIntro(now) {
  T = Math.max(T, INTRO); introDone = true;
  introUpdate();
  live.groups = null;
  EYES.forEach((e, i) => { live.small[i].base = 1; e.st.blinkAt = now + 800 + Math.random() * 6000; });
  eyeCtl.blinkAt = now + 2200; eyeCtl.nextLook = now + 1600;
  document.getElementById('hint').textContent = TOUCH ? 'arraste o dedo — ele segue você' : 'mova o mouse — ele segue você';
  document.getElementById('hint').classList.add('on');
  document.getElementById('bar').classList.add('on');
  setTimeout(() => document.getElementById('hint').classList.remove('on'), 7000);
  setTimeout(prepareShare, 1200);
}

function liveUpdate(dt, now) {
  const E = live.eye, C = eyeCtl, { cx, cy, R } = L.eye;
  const recent = now - ptr.at < 3500;
  // para onde olhar
  if (recent) {
    C.tlx = Math.tanh((ptr.x - cx) / 380); C.tly = Math.tanh((ptr.y - cy) / 380);
  } else if (now > C.nextLook) {
    if (Math.random() < .4) { C.tlx = 0; C.tly = 0; }
    else { C.tlx = (Math.random() * 2 - 1) * .85; C.tly = (Math.random() * 2 - 1) * .6; }
    C.nextLook = now + (REDUCED ? 3500 : 900) + Math.random() * 2200;
  }
  const kLook = 1 - Math.exp(-dt * 16);
  E.lx += (C.tlx - E.lx) * kLook; E.ly += (C.tly - E.ly) * kLook;
  // aperta o olho quando você chega perto
  const d = Math.hypot(ptr.x - cx, ptr.y - cy), near = recent && d < R * 1.05;
  C.squint += ((near ? .64 : 1) - C.squint) * (1 - Math.exp(-dt * 6));
  // piscar
  if (now > C.blinkAt) { C.blinkStart = now; C.double = Math.random() < .18; C.blinkAt = now + 2600 + Math.random() * 4200; }
  let b = blinkCurve((now - C.blinkStart) / 230);
  if (C.double) b = Math.max(b, blinkCurve((now - C.blinkStart - 300) / 230));
  E.open = C.squint * (1 - b);
  // pupila
  const pupilT = (near ? .08 : .15) + .025 * Math.sin(now / 1400);
  E.pupil += (pupilT - E.pupil) * (1 - Math.exp(-dt * 4));
  C.flash *= Math.exp(-dt * 3.2);
  E.glow = (1 + .07 * Math.sin(now / 900)) * (.55 + .45 * E.open) + C.flash;
  // olhinhos
  EYES.forEach((e, i) => {
    const st = live.small[i], es = e.st;
    const dd = Math.hypot(ptr.x - e.x, ptr.y - e.y);
    if (recent && dd < 140 + e.s * 3) es.shyUntil = now + 700 + Math.random() * 900;
    const target = now < es.shyUntil ? 0 : 1;
    st.base += (target - st.base) * (1 - Math.exp(-dt * (target < st.base ? 22 : 4)));
    if (now > es.blinkAt) { es.blinkStart = now; es.blinkAt = now + 1800 + Math.random() * 7000; }
    st.open = st.base * (1 - blinkCurve((now - es.blinkStart) / 190));
    let tx, ty;
    if (recent) { const dx = ptr.x - e.x, dy = ptr.y - e.y, n = Math.hypot(dx, dy) || 1; tx = dx / n * Math.min(1, n / 220); ty = dy / n * Math.min(1, n / 220); }
    else { tx = Math.sin(now / 2100 + es.phase) * .5; ty = Math.cos(now / 2700 + es.phase) * .3; }
    st.lx += (tx - st.lx) * (1 - Math.exp(-dt * 8)); st.ly += (ty - st.ly) * (1 - Math.exp(-dt * 8));
  });
}
function blinkCurve(p) {
  if (p < 0 || p > 1) return 0;
  return p < .38 ? easeIO(p / .38) : 1 - easeIO((p - .38) / .62);
}

function frame(now) {
  const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
  if (!introDone) { T += dt; if (T >= INTRO) finishIntro(now); else introUpdate(); }
  if (introDone) liveUpdate(dt, now);
  if (!REDUCED) { live.dash += dt * .05; live.sweep += dt * .55; }
  render(ctx, kit, live);
  requestAnimationFrame(frame);
}

/* ---------- interação ---------- */
function toPoster(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
window.addEventListener('pointermove', e => { const p = toPoster(e); ptr.x = p.x; ptr.y = p.y; ptr.at = performance.now(); }, { passive: true });
cv.addEventListener('pointerdown', e => {
  const now = performance.now(), p = toPoster(e);
  ptr.x = p.x; ptr.y = p.y; ptr.at = now;
  if (!introDone) { finishIntro(now); return; }
  live.eye.pupil = .04; eyeCtl.flash = .5;
  const { cx, cy, ew, eh } = L.eye;
  if (Math.abs(p.x - cx) < ew && Math.abs(p.y - cy) < eh) { eyeCtl.blinkStart = now; eyeCtl.double = false; }
});
document.documentElement.addEventListener('mouseleave', () => { ptr.at = -1e9; });
window.addEventListener('keydown', e => { if (!introDone && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) finishIntro(performance.now()); });

/* ---------- exportar / compartilhar ---------- */
let shareBlob = null;
function exportPNG(scale = 2) {
  const c = layer(W * scale, H * scale), x = c.getContext('2d');
  render(x, buildKit(scale, false, x, makeGrain(7)), stillState());
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/png'));
}
async function prepareShare() {
  if (shareBlob) return shareBlob;
  try { shareBlob = await exportPNG(1.5); } catch (e) { shareBlob = await exportPNG(1); }
  return shareBlob;
}
const toastEl = document.getElementById('toast');
let toastTm;
function toast(msg, ms = 2600) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTm); toastTm = setTimeout(() => toastEl.classList.remove('on'), ms);
}
function download(blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = FILE;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const shareBtn = document.getElementById('share'), saveBtn = document.getElementById('save');
try {
  if (navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.png', { type: 'image/png' })] })) {
    shareBtn.hidden = false; saveBtn.classList.remove('primary');
  } else saveBtn.classList.add('primary');
} catch (e) { saveBtn.classList.add('primary'); }

shareBtn.addEventListener('click', async () => {
  if (!shareBlob) { toast('Preparando a imagem…'); shareBtn.disabled = true; await prepareShare(); shareBtn.disabled = false; }
  const file = new File([shareBlob], FILE, { type: 'image/png' });
  try { await navigator.share({ files: [file], text: SHARE_TEXT }); }
  catch (e) { if (e && e.name !== 'AbortError') { download(shareBlob); toast('Imagem baixada'); } }
});
saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true; toast('Gerando imagem…');
  try { download(await prepareShare()); toast('Pronto! Veja seus downloads'); }
  catch (e) { toast('Não deu certo. Tente de novo.'); }
  saveBtn.disabled = false;
});

/* ---------- início ---------- */
async function boot() {
  try {
    await Promise.all([
      document.fonts.load(`900 100px ${FD}`), document.fonts.load(`italic 40px ${FS}`),
      document.fonts.load(`40px ${FS}`), document.fonts.load(`500 20px ${FM}`)
    ]);
  } catch (e) { /* segue com as fontes de reserva */ }
  makeLayout(); makeEyes();
  live.small = EYES.map(() => ({ base: 0, open: 0, lx: 0, ly: 0 }));
  GRAIN = makeGrain();
  fit();
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fit, 150); });
  if (REDUCED) finishIntro(performance.now());
  else { const h = document.getElementById('hint'); h.textContent = TOUCH ? 'toque para pular' : 'clique para pular'; h.classList.add('on'); }
  window.__convite = { exportPNG, ready: true, seek: t => { T = t; } };
  requestAnimationFrame(frame);
}
boot();
})();
</script>
