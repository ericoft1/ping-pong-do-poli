:root{--ink:#0b0910;--bone:#f1ecff;--orange:#ff7a1a;--green:#6dff5a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:"Outfit",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#poster{display:block;touch-action:none;cursor:pointer;background:var(--ink)}
.dock{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:68px}
.hint{font:400 13px/1 "Tilt Neon",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#d6b8ff;text-shadow:0 0 8px rgba(176,92,255,.8);opacity:0;transition:opacity 1.2s ease}
.hint.on{opacity:1}
.bar{display:flex;gap:8px;opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.bar.on{opacity:1;transform:none;pointer-events:auto}
.bar button{appearance:none;margin:0;font:400 13px/1 "Tilt Neon",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);background:rgba(255,255,255,.04);border:1.5px solid rgba(241,236,255,.3);padding:12px 16px;border-radius:999px;cursor:pointer;transition:border-color .2s,box-shadow .2s,color .2s}
.bar button:hover{border-color:var(--green);box-shadow:0 0 14px rgba(109,255,90,.45)}
.bar button.primary{border-color:var(--green);color:#eaffe6;box-shadow:0 0 12px rgba(109,255,90,.5),inset 0 0 10px rgba(109,255,90,.25);text-shadow:0 0 6px rgba(109,255,90,.9)}
.bar button[hidden]{display:none}
.bar button:disabled{opacity:.55;cursor:progress}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-8px);font:400 13px/1.2 "Tilt Neon",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--bone);background:rgba(14,11,20,.9);border:1px solid rgba(241,236,255,.2);padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .3s ease,transform .3s ease;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

const SHARE_TEXT = 'Festa de Halloween · quinta, 29/10, às 14h, no Anfiteatro do Colégio Politécnico. Venha fantasiado e leve um alimento para compartilhar!';

/* ---------- pintura de tubos ---------- */
function shapeOf(x, e, fi, ox = 0, oy = 0) {
  if (e.rect || e.line) {
    const p = new Path2D();
    if (e.rect) { const [a, b, c, d] = e.rect, rr = 30; p.moveTo(a + rr, b); p.arcTo(c, b, c, d, rr); p.arcTo(c, d, a, d, rr); p.arcTo(a, d, a, b, rr); p.arcTo(a, b, c, b, rr); p.closePath(); }
    else { const [a, b, c, d] = e.line; p.moveTo(a, b); p.lineTo(c, d); }
    x.translate(ox, oy);
    return { list: [p], s: 1 };
  }
  const [tx, ty, s, rot] = e.t;
  x.translate(tx + ox, ty + oy); x.rotate(rot); x.scale(s, s);
  const f = e.frames[fi];
  const list = e.combine ? e.frames.map(k => P[k]) : [P[f]].concat(e.id === 'rim' ? [P.pot] : []);
  return { list, s };
}
function variants(e) { return e.combine || e.id === 'rim' ? 1 : e.frames.length; }

function paintNeon(x, e, fi, sc) {
  const c = e.c;
  x.save();
  x.lineCap = 'round'; x.lineJoin = 'round';
  if (e.kind === 'text') {
    x.font = e.font;
    const draw = () => spaced(x, e.str, e.px, e.py, e.track || 0, 'center');
    x.shadowColor = c.glow;
    x.shadowBlur = 44 * sc; x.fillStyle = rgba(c.glow, .5); draw();
    x.shadowBlur = 16 * sc; x.fillStyle = rgba(c.glow, .8); draw();
    x.shadowBlur = 4 * sc; x.fillStyle = c.tube; draw();
    x.shadowBlur = 0; x.globalAlpha = e.coreA ?? .9; x.fillStyle = c.core; draw();
  } else {
    const { list, s } = shapeOf(x, e, fi), lw = e.lw / s;
    const stroke = () => list.forEach(p => x.stroke(p));
    x.shadowColor = c.glow;
    x.shadowBlur = 42 * sc; x.strokeStyle = rgba(c.glow, .4); x.lineWidth = lw * 2.4; stroke();
    x.shadowBlur = 15 * sc; x.strokeStyle = rgba(c.glow, .75); x.lineWidth = lw * 1.4; stroke();
    x.shadowBlur = 4 * sc; x.strokeStyle = c.tube; x.lineWidth = lw; stroke();
    x.shadowBlur = 0; x.strokeStyle = c.core; x.lineWidth = lw * .42; stroke();
  }
  x.restore();
}

function paintGlass(x, e) {
  if (e.hidden) return;
  for (let fi = 0; fi < variants(e); fi++) {
    for (const pass of (fi ? [1] : [0, 1])) {
      x.save(); x.lineCap = 'round'; x.lineJoin = 'round';
      const ox = pass ? 0 : 5, oy = pass ? 0 : 8;
      if (e.kind === 'text') {
        x.font = e.font;
        x.translate(ox, oy);
        x.fillStyle = pass ? 'rgba(220,226,255,.07)' : 'rgba(0,0,0,.42)';
        spaced(x, e.str, e.px, e.py, e.track || 0, 'center');
      } else {
        const { list, s } = shapeOf(x, e, fi, ox, oy), lw = e.lw / s;
        if (pass) {
          x.strokeStyle = `rgba(214,222,245,${fi ? .055 : .085})`; x.lineWidth = lw * 1.05; list.forEach(p => x.stroke(p));
          x.strokeStyle = 'rgba(255,255,255,.1)'; x.lineWidth = lw * .28; list.forEach(p => x.stroke(p));
        } else {
          x.strokeStyle = 'rgba(0,0,0,.42)'; x.lineWidth = lw * 1.1; list.forEach(p => x.stroke(p));
        }
      }
      x.restore();
    }
  }
}

/* ---------- parede de tijolos (albedo, usado com multiply) ---------- */
function paintBricks(x) {
  const r = rng(404), bw = 112, bh = 44, m = 6;
  x.fillStyle = 'rgb(64,58,66)'; x.fillRect(0, 0, W, H);
  for (let row = 0, y = -20; y < H; row++, y += bh + m) {
    for (let bx = (row % 2 ? -(bw + m) / 2 : 0) - 20; bx < W; bx += bw + m) {
      const burnt = r() < .1, L = burnt ? .4 + r() * .14 : .6 + r() * .3;
      const R = 238 * L | 0, Gc = 196 * L * (.96 + r() * .06) | 0, B = 186 * L * (.94 + r() * .1) | 0;
      const g = x.createLinearGradient(0, y, 0, y + bh);
      g.addColorStop(0, `rgb(${Math.min(255, R + 22)},${Math.min(255, Gc + 20)},${Math.min(255, B + 20)})`);
      g.addColorStop(.18, `rgb(${R},${Gc},${B})`);
      g.addColorStop(1, `rgb(${R * .78 | 0},${Gc * .78 | 0},${B * .8 | 0})`);
      x.fillStyle = g;
      x.beginPath(); x.roundRect ? x.roundRect(bx, y, bw, bh, 3) : x.rect(bx, y, bw, bh); x.fill();
      for (let k = 0; k < 26; k++) {
        const d = r() < .5;
        x.fillStyle = d ? `rgba(40,30,30,${.12 + r() * .2})` : `rgba(255,240,230,${.06 + r() * .1})`;
        x.fillRect(bx + r() * bw, y + r() * bh, 1 + r() * 2.6, 1 + r() * 2.2);
      }
      if (r() < .25) { x.fillStyle = 'rgba(30,22,24,.35)'; x.beginPath(); x.arc(bx + (r() < .5 ? 2 : bw - 2), y + r() * bh, 3 + r() * 5, 0, TAU); x.fill(); }
    }
  }
  for (let k = 0; k < 14; k++) {
    const cx = r() * W, cy = r() * H, rad = 120 + r() * 320, g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, `rgba(20,14,22,${.16 + r() * .16})`); g.addColorStop(1, 'rgba(20,14,22,0)');
    x.fillStyle = g; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }
}

function paintPrint(x) {
  x.save();
  PRINT.forEach(p => {
    x.font = p.font; x.textAlign = p.align;
    x.shadowColor = 'rgba(0,0,0,.85)'; x.shadowBlur = 14 * CUR_SC; x.shadowOffsetY = 2 * CUR_SC;
    x.fillStyle = `rgba(250,246,255,${p.a})`; x.fillText(p.str, p.x, p.y);
  });
  x.restore();
}
let CUR_SC = 1;

function paintOverlay(x, grain) {
  const g = x.createRadialGradient(540, 820, 520, 540, 820, 1320);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.62)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
  x.fillStyle = x.createPattern(grain, 'repeat'); x.fillRect(0, 0, x.canvas.width, x.canvas.height);
  x.restore();
}

function makeGrain(amp) {
  const S = 256, c = layer(S, S), x = c.getContext('2d'), img = x.createImageData(S, S), d = img.data, r = rng(77);
  for (let i = 0; i < d.length; i += 4) { const v = r(); d[i] = d[i + 1] = d[i + 2] = v > .5 ? 255 : 0; d[i + 3] = Math.abs(v - .5) * 2 * amp | 0; }
  x.putImageData(img, 0, 0);
  return c;
}

/* ---------- kit de camadas para uma escala ---------- */
function buildKit(sc, live) {
  CUR_SC = sc;
  const kit = { sc, neon: {}, live };
  ELS.forEach(e => {
    kit.neon[e.id] = [];
    for (let fi = 0; fi < variants(e); fi++) {
      const [x0, y0, x1, y1] = e.box, ox = x0 - GLOW, oy = y0 - GLOW;
      const c = layer((x1 - x0 + GLOW * 2) * sc, (y1 - y0 + GLOW * 2) * sc), x = c.getContext('2d');
      x.setTransform(sc, 0, 0, sc, -ox * sc, -oy * sc);
      paintNeon(x, e, fi, sc);
      kit.neon[e.id].push({ c, ox, oy });
    }
  });
  kit.light = layer(W / 4, H / 4);
  kit.grain = makeGrain(live ? 12 : 7);
  if (live) {
    const full = paint => { const c = layer(W * sc, H * sc), x = c.getContext('2d'); x.setTransform(sc, 0, 0, sc, 0, 0); paint(x); return c; };
    kit.bricks = full(paintBricks);
    kit.glass = full(x => ELS.forEach(e => paintGlass(x, e)));
    kit.print = full(paintPrint);
    kit.overlay = full(x => paintOverlay(x, kit.grain));
  }
  return kit;
}

/* ---------- quadro ---------- */
function blitFull(x, c, op) { x.save(); x.setTransform(1, 0, 0, 1, 0, 0); if (op) x.globalCompositeOperation = op; x.drawImage(c, 0, 0); x.restore(); }

function render(x, kit, S) {
  const sc = kit.sc, cw = x.canvas.width, ch = x.canvas.height;
  CUR_SC = sc;
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';

  // luz ambiente + luz dos neons, numa tela pequena (gradientes suaves escalam bem)
  const lc = kit.light.getContext('2d');
  lc.setTransform(.25, 0, 0, .25, 0, 0); lc.globalCompositeOperation = 'source-over';
  let g = lc.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a2140'); g.addColorStop(.5, '#1c1629'); g.addColorStop(1, '#100d17');
  lc.fillStyle = g; lc.fillRect(0, 0, W, H);
  lc.globalCompositeOperation = 'lighter';
  ELS.forEach(e => {
    const on = S.on[e.id] || 0; if (on <= 0 || e.light <= 0) return;
    const [x0, y0, x1, y1] = e.box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + (e.moves ? S.spiderDy : 0);
    const rad = clamp(Math.max(x1 - x0, y1 - y0) * .85 + 150, 200, 720);
    const gg = lc.createRadialGradient(cx, cy, 0, cx, cy, rad);
    gg.addColorStop(0, rgba(e.c.glow, e.light * on)); gg.addColorStop(.4, rgba(e.c.glow, e.light * on * .35)); gg.addColorStop(1, rgba(e.c.glow, 0));
    lc.fillStyle = gg; lc.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  });
  x.imageSmoothingEnabled = true;
  x.drawImage(kit.light, 0, 0, cw, ch);

  // tijolos por cima com multiply: a luz revela a textura
  if (kit.bricks) blitFull(x, kit.bricks, 'multiply');
  else { const c = layer(cw, ch), bx = c.getContext('2d'); bx.setTransform(sc, 0, 0, sc, 0, 0); paintBricks(bx); blitFull(x, c, 'multiply'); }

  // vidro dos tubos (apagados) e sombra deles na parede
  if (kit.glass) blitFull(x, kit.glass);
  else { x.save(); x.setTransform(sc, 0, 0, sc, 0, 0); ELS.forEach(e => paintGlass(x, e)); x.restore(); }

  // fio da aranha
  const sp = BY.spider, sdy = S.spiderDy;
  x.save(); x.setTransform(sc, 0, 0, sc, 0, 0);
  const son = S.on.spider || 0;
  x.strokeStyle = 'rgba(210,220,240,.12)'; x.lineWidth = 1.6;
  x.beginPath(); x.moveTo(sp.t[0], 196); x.lineTo(sp.t[0], sp.t[1] - 22 + sdy); x.stroke();
  if (son > 0) {
    x.globalCompositeOperation = 'lighter';
    x.strokeStyle = rgba(NEON.green.glow, .5 * son); x.lineWidth = 3; x.shadowColor = NEON.green.glow; x.shadowBlur = 10 * sc;
    x.beginPath(); x.moveTo(sp.t[0], 196); x.lineTo(sp.t[0], sp.t[1] - 22 + sdy); x.stroke();
    x.shadowBlur = 0; x.strokeStyle = rgba(NEON.green.core, .8 * son); x.lineWidth = 1;
    x.stroke();
  }
  x.restore();

  // neons acesos
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'lighter';
  ELS.forEach(e => {
    const on = S.on[e.id] || 0; if (on <= .002) return;
    const L = kit.neon[e.id][Math.min(S.frame[e.id] || 0, kit.neon[e.id].length - 1)];
    x.globalAlpha = Math.min(1, on);
    x.drawImage(L.c, Math.round(L.ox * sc), Math.round((L.oy + (e.moves ? sdy : 0)) * sc));
  });
  x.restore();

  // estrelinhas
  x.save(); x.setTransform(sc, 0, 0, sc, 0, 0); x.globalCompositeOperation = 'lighter';
  STARS.forEach((s, i) => {
    const tw = S.stars[i]; if (tw <= 0) return;
    const R = 13 * s.s * (.75 + .25 * tw);
    x.save(); x.translate(s.x, s.y);
    x.shadowColor = NEON.yellow.glow; x.shadowBlur = 14 * sc;
    x.fillStyle = rgba(NEON.yellow.core, .9 * tw);
    x.beginPath(); x.moveTo(0, -R); x.quadraticCurveTo(0, 0, R, 0); x.quadraticCurveTo(0, 0, 0, R); x.quadraticCurveTo(0, 0, -R, 0); x.quadraticCurveTo(0, 0, 0, -R); x.fill();
    x.restore();
  });
  x.restore();

  // texto impresso
  if (S.print > 0) {
    x.save(); x.globalAlpha = S.print;
    if (kit.print) blitFull(x, kit.print); else { x.setTransform(sc, 0, 0, sc, 0, 0); paintPrint(x); }
    x.restore();
  }

  // morcegos de verdade voando na frente
  x.save(); x.setTransform(sc, 0, 0, sc, 0, 0);
  S.flyers.forEach(f => drawFlyer(x, f));
  x.globalCompositeOperation = 'lighter';
  S.motes.forEach(m => { x.fillStyle = `rgba(255,236,214,${m.a})`; x.beginPath(); x.arc(m.x, m.y, m.r, 0, TAU); x.fill(); });
  x.restore();

  if (kit.overlay) blitFull(x, kit.overlay);
  else { x.save(); x.setTransform(sc, 0, 0, sc, 0, 0); paintOverlay(x, kit.grain); x.restore(); }
}

function drawFlyer(x, f) {
  const s = f.s, flap = Math.sin(f.ph) * .9;
  x.save(); x.translate(f.x, f.y); x.rotate(f.rot || 0);
  x.fillStyle = 'rgba(6,4,9,.94)';
  x.beginPath(); x.ellipse(0, 0, s * .18, s * .3, 0, 0, TAU); x.fill();
  [-1, 1].forEach(side => {
    const ty = -flap * s * .9;
    x.beginPath();
    x.moveTo(side * s * .12, -s * .12);
    x.quadraticCurveTo(side * s * .6, ty - s * .35, side * s * 1.2, ty);
    x.quadraticCurveTo(side * s * .95, ty * .4 + s * .2, side * s * .78, ty * .3 + s * .12);
    x.quadraticCurveTo(side * s * .6, ty * .2 + s * .28, side * s * .42, s * .14);
    x.quadraticCurveTo(side * s * .3, s * .3, side * s * .1, s * .14);
    x.closePath(); x.fill();
  });
  x.restore();
}

/* ---------- estado ---------- */
function flick(t, t0, seed) {
  if (t < t0) return 0;
  const p = t - t0; if (p > .6) return 1;
  const k = Math.floor(p * 34);
  return hash(k + seed * 17.3) < .3 + p * 1.1 ? (p > .45 ? 1 : .85) : .06;
}

function stillState() {
  const on = {}, frame = {};
  ELS.forEach(e => { on[e.id] = e.hidden ? 0 : 1; frame[e.id] = 0; });
  frame.arms = 1; frame.bat1 = 1; frame.bat3 = 1;
  return {
    on, frame, spiderDy: 0, print: 1,
    stars: STARS.map((s, i) => [.95, .7, .5, .85, .6, .45, .55, .4][i]),
    flyers: [{ x: 842, y: 258, s: 15, ph: 1.2, rot: -.2 }, { x: 900, y: 318, s: 11, ph: -.6, rot: -.15 }, { x: 806, y: 316, s: 9, ph: .4, rot: -.25 }],
    motes: (() => { const r = rng(5); return Array.from({ length: 26 }, () => ({ x: 80 + r() * 920, y: 220 + r() * 820, r: .7 + r() * 1.6, a: .08 + r() * .18 })); })()
  };
}

const live = { on: {}, frame: {}, spiderDy: 0, print: 0, stars: [], flyers: [], motes: [] };
const ctl = { blinkAt: 0, blinkUntil: 0, faceUntil: 0, faceAt: 0, booAt: -1e9, surgeAt: -1e9, dropAt: -1e9, flockAt: 0, faults: {} };
let T = REDUCED ? INTRO : 0, introDone = false, last = 0;

function seedMotes() {
  const r = rng(9);
  live.motes = Array.from({ length: 34 }, () => ({ x: r() * W, y: 200 + r() * 900, r: .7 + r() * 1.7, a: 0, base: .08 + r() * .2, vy: -(5 + r() * 12), ph: r() * TAU }));
}

function update(dt, now) {
  const t = T, secs = now / 1000;
  ELS.forEach((e, i) => {
    let on = introDone ? 1 : flick(t, e.on, i + 1);
    if (e.hidden) on = 0;
    if (introDone && e.fault) {
      const f = ctl.faults[e.id] || (ctl.faults[e.id] = { at: now + 3000 + Math.random() * 6000, until: 0 });
      if (now > f.at) { f.until = now + 650; f.at = now + 4500 + Math.random() * 7000; }
      if (now < f.until) on = hash(Math.floor(now / 38) + i) < .5 ? .12 : 1;
    }
    if (introDone && now - ctl.surgeAt < 520) on *= hash(Math.floor((now - ctl.surgeAt) / 45) + i * 3.1) < .45 ? .15 : 1;
    live.on[e.id] = on;
  });
  // BOO!
  const booP = (now - ctl.booAt) / 1000;
  live.on.boo = booP >= 0 && booP < 1.6 ? flick(booP, 0, 5) * (booP > 1.35 ? 1 - (booP - 1.35) / .25 : 1) : 0;
  // quadros alternados, como placa de neon animada
  live.frame.arms = booP >= 0 && booP < 1.6 ? 1 : Math.floor(secs / .6) % 2;
  if (now > ctl.blinkAt) { ctl.blinkUntil = now + 170; ctl.blinkAt = now + 2600 + Math.random() * 3800; }
  live.frame.eyes = now < ctl.blinkUntil && !(booP >= 0 && booP < 1.6) ? 1 : 0;
  for (let i = 0; i < 4; i++) live.frame['bat' + i] = Math.floor(secs * 3.2 + BY['bat' + i].phase * 2) % 2;
  if (introDone && now > ctl.faceAt) { ctl.faceUntil = now + 700; ctl.faceAt = now + 4200 + Math.random() * 4000; }
  live.frame.face = now < ctl.faceUntil ? 1 : 0;
  live.frame.bubbles = Math.floor(secs / .5) % 2;
  live.frame.legs = Math.floor(secs / .34) % 2;
  // aranha sobe e desce
  const dp = (now - ctl.dropAt) / 1000;
  const drop = dp >= 0 && dp < 1.8 ? Math.sin(Math.min(1, dp / .35) * Math.PI / 2) * 130 * (dp < .6 ? 1 : 1 - ease((dp - .6) / 1.2)) : 0;
  live.spiderDy = (REDUCED ? 0 : Math.sin(secs * 1.25) * 12) + drop;
  // estrelas
  live.stars = STARS.map((s, i) => introDone || t > 2.2 + i * .15 ? .55 + .45 * Math.sin(secs * s.sp + s.ph) : 0);
  // texto impresso
  live.print = introDone ? 1 : ease(span(t, 4.1, 4.8));
  // poeira
  live.motes.forEach(m => {
    m.y += m.vy * dt; m.x += Math.sin(secs * .6 + m.ph) * 6 * dt;
    if (m.y < 180) { m.y = 1100; m.x = Math.random() * W; }
    m.a = m.base * (.6 + .4 * Math.sin(secs * 1.7 + m.ph)) * (introDone ? 1 : span(t, 2, 4));
  });
  // revoada
  if (!REDUCED && introDone && now > ctl.flockAt) {
    const n = 3 + (Math.random() * 3 | 0), y0 = 260 + Math.random() * 380, dir = Math.random() < .5 ? 1 : -1;
    for (let k = 0; k < n; k++) live.flyers.push({ x: dir > 0 ? -60 - k * 70 - Math.random() * 40 : W + 60 + k * 70, y: y0 + (Math.random() - .5) * 120, base: 0,
      vx: dir * (230 + Math.random() * 120), s: 10 + Math.random() * 12, ph: Math.random() * TAU, fr: 16 + Math.random() * 6, amp: 18 + Math.random() * 26, rot: dir * -.12 });
    live.flyers.forEach(f => { f.base = f.y; });
    ctl.flockAt = now + 7000 + Math.random() * 6000;
  }
  live.flyers.forEach(f => { f.x += f.vx * dt; f.ph += f.fr * dt; f.y = f.base + Math.sin(f.x / 90) * f.amp; });
  live.flyers = live.flyers.filter(f => f.x > -260 && f.x < W + 260);
}

/* ---------- laço ---------- */
const cv = document.getElementById('poster'), ctx = cv.getContext('2d');
let kit = null;
function fit() {
  const vv = window.visualViewport, vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
  const s = Math.min(vw / W, (vh - 92) / H), dw = Math.floor(W * s), dh = Math.floor(H * s);
  cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
  const sc = clamp(dw * Math.min(window.devicePixelRatio || 1, 3) / W, .3, 1.25);
  if (!kit || Math.abs(kit.sc - sc) > .02) { cv.width = Math.round(W * sc); cv.height = Math.round(H * sc); kit = buildKit(sc, true); }
}
function finishIntro(now) {
  T = Math.max(T, INTRO); introDone = true;
  ctl.blinkAt = now + 2000; ctl.faceAt = now + 3500; ctl.flockAt = now + 1500;
  const h = document.getElementById('hint');
  h.textContent = (TOUCH ? 'toque' : 'clique') + ' no fantasma, na abóbora e na aranha';
  h.classList.add('on'); document.getElementById('bar').classList.add('on');
  setTimeout(() => h.classList.remove('on'), 8000);
  setTimeout(prepareShare, 1500);
}
function frame(now) {
  const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
  if (!introDone) { T += dt; if (T >= INTRO) finishIntro(now); }
  update(dt, now);
  render(ctx, kit, live);
  requestAnimationFrame(frame);
}

/* ---------- toque ---------- */
function toPoster(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
const inBox = (p, b, pad = 0, dy = 0) => p.x > b[0] - pad && p.x < b[2] + pad && p.y > b[1] - pad + dy && p.y < b[3] + pad + dy;
cv.addEventListener('pointerdown', e => {
  const now = performance.now();
  if (!introDone) { finishIntro(now); return; }
  const p = toPoster(e);
  if (inBox(p, BY.ghost.box, 10)) { ctl.booAt = now; ctl.blinkUntil = 0; }
  else if (inBox(p, BY.pumpkin.box, 20)) { ctl.faceUntil = now + 1400; }
  else if (inBox(p, BY.spider.box, 30, live.spiderDy)) { if (now - ctl.dropAt > 1800) ctl.dropAt = now; }
  else ctl.surgeAt = now;
});
window.addEventListener('keydown', e => { if (!introDone && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) finishIntro(performance.now()); });

/* ---------- exportar / compartilhar ---------- */
let shareBlob = null;
function exportPNG(scale = 1.5) {
  const c = layer(W * scale, H * scale), x = c.getContext('2d');
  render(x, buildKit(scale, false), stillState());
  CUR_SC = kit ? kit.sc : 1;
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/png'));
}
async function prepareShare() {
  if (shareBlob) return shareBlob;
  try { shareBlob = await exportPNG(1.5); } catch (e) { shareBlob = await exportPNG(1); }
  return shareBlob;
}
const toastEl = document.getElementById('toast'); let toastTm;
function toast(msg, ms = 2600) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastTm); toastTm = setTimeout(() => toastEl.classList.remove('on'), ms); }
function download(blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = FILE;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const shareBtn = document.getElementById('share'), saveBtn = document.getElementById('save');
try {
  if (navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.png', { type: 'image/png' })] })) shareBtn.hidden = false;
  else saveBtn.classList.add('primary');
} catch (e) { saveBtn.classList.add('primary'); }
shareBtn.addEventListener('click', async () => {
  if (!shareBlob) { toast('Preparando a imagem…'); shareBtn.disabled = true; await prepareShare(); shareBtn.disabled = false; }
  try { await navigator.share({ files: [new File([shareBlob], FILE, { type: 'image/png' })], text: SHARE_TEXT }); }
  catch (e) { if (e && e.name !== 'AbortError') { download(shareBlob); toast('Imagem baixada'); } }
});
saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true; toast('Gerando imagem…');
  try { download(await prepareShare()); toast('Pronto! Veja seus downloads'); } catch (e) { toast('Não deu certo. Tente de novo.'); }
  saveBtn.disabled = false;
});

/* ---------- início ---------- */
async function boot() {
  try { await Promise.all([document.fonts.load(`40px ${FN}`), document.fonts.load(`80px ${FSC}`), document.fonts.load(`400 30px ${FB}`), document.fonts.load(`600 30px ${FB}`)]); } catch (e) {}
  MEASURE = layer(4, 4).getContext('2d');
  paths(); makeElements(); seedMotes();
  fit();
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fit, 150); });
  if (REDUCED) finishIntro(performance.now());
  else { const h = document.getElementById('hint'); h.textContent = TOUCH ? 'toque para pular' : 'clique para pular'; h.classList.add('on'); }
  window.__convite = { exportPNG, ready: true, seek: t => { T = t; } };
  requestAnimationFrame(frame);
}
boot();
})();
</script>
</body>
